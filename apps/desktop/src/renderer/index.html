<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CopyCloud</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      overflow: hidden;
    }
    
    .header {
      padding: 16px;
      background: #16213e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #0f3460;
    }
    
    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }
    
    .search {
      padding: 12px 16px;
      background: #16213e;
    }
    
    .search input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #0f3460;
      border-radius: 6px;
      background: #1a1a2e;
      color: #eee;
      font-size: 14px;
    }
    
    .clipboard-list {
      height: calc(100vh - 120px);
      overflow-y: auto;
      padding: 8px;
    }
    
    .clipboard-item {
      padding: 12px;
      margin: 4px 0;
      background: #16213e;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .clipboard-item:hover {
      background: #0f3460;
    }
    
    .clipboard-item .content {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .clipboard-item .meta {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
    
    .clipboard-item.pinned {
      border-left: 3px solid #e94560;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📋 CopyCloud</h1>
    <button onclick="window.close()">✕</button>
  </div>
  
  <div class="search">
    <input type="text" placeholder="🔍 Search clips...">
  </div>
  
  <div class="clipboard-list" id="clipboard-list">
    <div class="empty-state">
      <p>Copy something to get started</p>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    
    // Load clipboard history
    async function loadClipboard() {
      const response = await fetch('http://localhost:3000/api/clipboard', {
        headers: {
          'Authorization': `Bearer ${localStorage.getItem('token')}`
        }
      });
      const data = await response.json();
      
      if (data.success) {
        renderClips(data.data);
      }
    }
    
    // Render clips
    function renderClips(clips) {
      const list = document.getElementById('clipboard-list');
      
      if (clips.length === 0) {
        list.innerHTML = '<div class="empty-state"><p>Copy something to get started</p></div>';
        return;
      }
      
      list.innerHTML = clips.map(clip => `
        <div class="clipboard-item ${clip.metadata.pinned ? 'pinned' : ''}" onclick="copyClip('${clip.id}')">
          <div class="content">${escapeHtml(clip.encrypted_content)}</div>
          <div class="meta">${clip.content_type} • ${timeAgo(clip.created_at)}</div>
        </div>
      `).join('');
    }
    
    // Copy clip to clipboard
    async function copyClip(id) {
      // TODO: Implement copy functionality
      console.log('Copy clip:', id);
    }
    
    // Time ago helper
    function timeAgo(timestamp) {
      const seconds = Math.floor((new Date() - new Date(timestamp)) / 1000);
      if (seconds < 60) return 'just now';
      if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
      if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
      return `${Math.floor(seconds / 86400)}d ago`;
    }
    
    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    // Initialize
    loadClipboard();
  </script>
</body>
</html>
