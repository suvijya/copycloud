name: copycloud_mobile
description: CopyCloud - Cross-device clipboard sync
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.0.0
  web_socket_channel: ^2.4.0
  crypto: ^3.0.3
  encrypt: ^5.0.3
  provider: ^6.1.1
  go_router: ^13.0.0
  flutter_animate: ^4.3.0
  google_fonts: ^6.1.0
  uuid: ^4.2.1
  intl: ^0.19.0
  share_handler: ^0.0.19
  flutter_local_notifications: ^17.0.0
  path_provider: ^2.1.2
  sqflite: ^2.3.2
  http: ^1.2.0
  url_launcher: ^6.2.2
  flutter_svg: ^2.0.9
  lottie: ^3.0.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  permission_handler: ^11.2.0
  connectivity_plus: ^5.0.2
  vibration: ^1.8.4
  flutter_slidable: ^3.0.1
  animated_text_kit: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
