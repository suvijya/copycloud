version: '3.8'

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - PORT=3000
    volumes:
      - ../apps/server:/app/apps/server
      - ../packages/shared:/app/packages/shared
    command: npm run dev