version: '3.8'

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=your-secret-key
      - PORT=3000
    volumes:
      - ../apps/server:/app/apps/server
      - ../packages/shared:/app/packages/shared
    command: npm run dev