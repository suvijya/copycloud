<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CopyCloud</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f0f1a;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        /* Title bar - draggable */
        .titlebar {
            -webkit-app-region: drag;
            height: 32px;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #888;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 16px;
        }
        
        .search-box {
            padding: 12px;
            background: #12121f;
        }
        
        .search-input {
            width: 100%;
            padding: 10px 14px;
            background: #1a1a2e;
            border: 1px solid #2d2d44;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        
        .search-input:focus {
            border-color: #667eea;
        }
        
        .clips-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        
        .clip-card {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .clip-card:hover {
            background: #252540;
        }
        
        .clip-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 11px;
            color: #666;
        }
        
        .clip-type {
            color: #667eea;
            text-transform: uppercase;
        }
        
        .clip-content {
            font-size: 13px;
            color: #ccc;
            line-height: 1.4;
            max-height: 48px;
            overflow: hidden;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .status-bar {
            padding: 10px 16px;
            background: #12121f;
            border-top: 1px solid #1a1a2e;
            font-size: 11px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="titlebar">CopyCloud</div>
        
        <div class="search-box">
            <input type="text" class="search-input" placeholder="🔍 Search clips...">
        </div>
        
        <div class="clips-container" id="clips-container">
            <div class="empty-state">
                <div class="empty-state-icon">📋</div>
                <p>Copy something to get started</p>
            </div>
        </div>
        
        <div class="status-bar">
            <span id="clip-count">0 clips</span>
            <span>CopyCloud v0.1</span>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        
        let allClips = [];
        
        // Load clips on start
        async function loadClips() {
            allClips = await ipcRenderer.invoke('get-clips');
            renderClips(allClips);
        }
        
        // Render clips to UI
        function renderClips(clips) {
            const container = document.getElementById('clips-container');
            const countEl = document.getElementById('clip-count');
            
            if (clips.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <p>Copy something to get started</p>
                    </div>
                `;
                countEl.textContent = '0 clips';
                return;
            }
            
            container.innerHTML = clips.map(clip => `
                <div class="clip-card" onclick="copyClip('${clip.content.replace(/'/g, "\\'")}')">
                    <div class="clip-meta">
                        <span class="clip-type">${clip.type}</span>
                        <span>${clip.device} • ${timeAgo(clip.timestamp)}</span>
                    </div>
                    <div class="clip-content">${escapeHtml(clip.content)}</div>
                </div>
            `).join('');
            
            countEl.textContent = `${clips.length} clips`;
        }
        
        // Copy clip to clipboard
        function copyClip(content) {
            ipcRenderer.invoke('copy-to-clipboard', content);
        }
        
        // Time ago helper
        function timeAgo(timestamp) {
            const seconds = Math.floor((new Date() - new Date(timestamp)) / 1000);
            if (seconds < 60) return 'just now';
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
            return `${Math.floor(seconds / 86400)}d ago`;
        }
        
        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Listen for new clips
        ipcRenderer.on('new-clip', (event, clip) => {
            allClips.unshift(clip);
            renderClips(allClips);
        });
        
        // Search
        document.querySelector('.search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allClips.filter(clip => 
                clip.content.toLowerCase().includes(query)
            );
            renderClips(filtered);
        });
        
        // Initialize
        loadClips();
    </script>
</body>
</html>
